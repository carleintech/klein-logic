services:
  postgres:
    image: postgres:16-alpine
    container_name: kleinlogic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kleinlogic_dev
      POSTGRES_USER: kleinlogic
      POSTGRES_PASSWORD: ${KLEINLOGIC_POSTGRES_PASSWORD}
    ports:
      - "55432:5432"
    volumes:
      - kleinlogic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kleinlogic -d kleinlogic_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  kleinlogic_postgres_data:
